# ============================================================
# Continuous Integration
# Propósito: Workflow inicial de CI focado exclusivamente em
# testes unitários. Estrutura simples e organizada, pensada
# para futura expansão (ex.: lint, build, cache, matrix, etc.)
# ============================================================

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_SCOPE: siman4

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Obter as configurações do Vercel
      - name: Pull Vercel config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      
      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN
      
      # 7. Deploy preview no vercel
      - name: Deploy Vercel preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Instalação do Chromium
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # 6. Execução dos Testes de Regressão
      - name: Run E2E Regression tests
        run: npx playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          TESTDINO_TOKEN: ${{ secrets.TD_TOKEN }}
      
      # 7. Relatório de Testes Automatizados
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          
  promote:
    name: Promote to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Obter as configurações do Vercel para produção
      - name: Pull Vercel config (production)
        run: yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # 6. Build com as vars de produção embutidas
      - name: Build Vercel (production)
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      # 7. Deploy direto para produção
      - name: Deploy to Production
        run: yarn vercel deploy --prebuilt --target=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
          
    
